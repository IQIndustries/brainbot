name: deploy
on:
  push:
    branches: [main]
jobs:
  launch-bot:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
    - name: Installing dependencies
      run: npm ci
    - name: Build
      run: npm run build
    - name: Connect to Tailscale
      uses: tailscale/github-action@v4.1.3
      with:
        oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
        oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
        tags: tag:ci
    - name: Clear previous build on server
      uses: appleboy/ssh-action@v1.2.5
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.KEY }}
        port: ${{ secrets.PORT || 22 }}
        timeout: 60s
        script: rm -rf brainbot/build
    - name: Copy build artifacts to server
      uses: appleboy/scp-action@v1.0.0
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.KEY }}
        port: ${{ secrets.PORT || 22 }}
        timeout: 60s
        source: build/,package.json,package-lock.json,ecosystem.config.cjs
        target: brainbot
    - name: Install production dependencies and reload
      uses: appleboy/ssh-action@v1.2.5
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.KEY }}
        port: ${{ secrets.PORT || 22 }}
        timeout: 60s
        command_timeout: 10m
        script: |
          set -e
          cd brainbot
          npm ci --omit=dev
          pm2 startOrReload ecosystem.config.cjs --update-env
